services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: rescuedesk
      POSTGRES_PASSWORD: rescuedesk
      POSTGRES_DB: rescuedesk
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuedesk -d rescuedesk"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rescuedesk-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      RESCUEDESK_DATABASE_URL: postgresql+psycopg://rescuedesk:rescuedesk@postgres:5432/rescuedesk
      RESCUEDESK_UPLOAD_DIR: /app/.runtime/uploads
      RESCUEDESK_ENABLE_LOCAL_AI: "false"
      RESCUEDESK_SEED_DEMO: "true"
      RESCUEDESK_JWT_SECRET: local-compose-demonstration-secret-change-before-deployment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - rescuedesk-runtime:/app/.runtime
      - ./fixtures:/app/fixtures:ro

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  rescuedesk-postgres:
  rescuedesk-runtime:
